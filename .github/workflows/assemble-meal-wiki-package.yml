name: Assemble Meal.wiki update package

on:
  push:
    branches:
      - meal-wiki-platform
    paths:
      - build/2.4.3/READY

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: meal-wiki-platform
          fetch-depth: 0

      - name: Assemble and verify package
        shell: bash
        run: |
          set -euo pipefail
          test -f build/2.4.3/READY
          test -n "$(find build/2.4.3 -maxdepth 1 -type f -name 'chunk-*' -print -quit)"
          cat $(find build/2.4.3 -maxdepth 1 -type f -name 'chunk-*' | sort) > meal-wiki-platform-2.4.3.zip.b64
          tr -d '\r\n' < meal-wiki-platform-2.4.3.zip.b64 | base64 --decode > /tmp/meal-wiki-platform-2.4.3.zip
          echo "19dcd7f00a112b27e2faa3a19aad887c6962e35782caa6237e108cff06c32256  /tmp/meal-wiki-platform-2.4.3.zip" | sha256sum --check --strict
          unzip -t /tmp/meal-wiki-platform-2.4.3.zip

      - name: Commit immutable payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meal-wiki-platform-2.4.3.zip.b64
          git commit -m "Publish Meal.wiki Platform 2.4.3 payload [skip ci]"
          git push origin HEAD:meal-wiki-platform
